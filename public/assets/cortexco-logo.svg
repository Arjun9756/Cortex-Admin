<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="cortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <filter id="cortexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3B82F6" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Neural Mark (Linked Nodes) -->
  <g transform="translate(6, 6) scale(0.2)" filter="url(#cortexGlow)">
    <image href="/assets/cortexco-mark-clean.png" width="256" height="256" />
  </g>
  <!-- Typography -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Geist', sans-serif" font-weight="700" font-size="28" letter-spacing="-0.5">
    <text x="68" y="42" fill="#FFFFFF">Cortex<tspan fill="url(#cortexGrad)">Co</tspan></text>
  </g>
</svg>
